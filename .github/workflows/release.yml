# Tag `vX.Y.Z` (or run by hand) and a draft release is built for macOS (Apple silicon and Intel), Linux and
# Windows, with the updater's latest.json when the signing key is set. The owner publishes the draft. The
# release body is the CHANGELOG.md section for the version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The same gate as CI, on the cheap runner, before four expensive builds start.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx eslint .
      - run: node --test scripts/*.test.mjs
      - name: Versions agree
        run: |
          set -eu
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json $pkg · tauri.conf.json $tauri · Cargo.toml $cargo · tag ${GITHUB_REF_NAME:-}"
          [ "$pkg" = "$tauri" ] && [ "$pkg" = "$cargo" ] || { echo "the three version fields differ"; exit 1; }
          case "${GITHUB_REF_NAME:-}" in v*) [ "v$pkg" = "$GITHUB_REF_NAME" ] || { echo "tag does not match the version"; exit 1; } ;; esac

  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # NSIS only: WiX's light.exe fails on the bundled template resources without saying why; the
            # .exe installer is what the updater uses anyway.
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Tectonic sidecar (cached)
        id: sidecar
        uses: actions/cache@v6
        with:
          path: src-tauri/binaries
          key: tectonic-0.17.0-${{ matrix.target }}
      - if: steps.sidecar.outputs.cache-hit != 'true'
        shell: bash
        run: TARGET_TRIPLE=${{ matrix.target }} node scripts/fetch-tectonic.mjs
      - name: Release notes from the changelog
        id: notes
        shell: bash
        run: |
          {
            echo "body<<__EOF__"
            node scripts/release-notes.mjs "${GITHUB_REF_NAME}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      # macOS code signing and notarisation, only when the secrets exist. An empty APPLE_CERTIFICATE
      # would make the bundler try to import nothing and fail; unsigned builds still produce a DMG.
      - name: Apple signing secrets
        if: startsWith(matrix.platform, 'macos') && env.HAVE_CERT == 'true'
        env:
          HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          {
            echo "APPLE_CERTIFICATE<<__EOF__"; echo "${{ secrets.APPLE_CERTIFICATE }}"; echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (required for auto-update artifacts)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dabir ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
