# Contributor licence agreement check, on when the repository variable CLA is "on". A contributor signs once by
# commenting the sentence below on their pull request; the signature is recorded in the cla-signatures branch.
# Dependabot and the owner are exempt. CLA.md explains why the project asks for it.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: ${{ vars.CLA == 'on' && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA and I hereby sign the CLA' || github.event_name == 'pull_request_target') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/surenalab/dabir/blob/main/CLA.md
          branch: cla-signatures
          allowlist: MohammadSadeghSalehi,dependabot[bot],bot*
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be reviewed the project needs your one-time agreement to the [contributor licence agreement](https://github.com/surenalab/dabir/blob/main/CLA.md), which lets Dabir stay AGPL and still be licensed differently where that does not fit. Comment the sentence below to sign.'
          custom-pr-sign-comment: 'I have read the CLA and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
