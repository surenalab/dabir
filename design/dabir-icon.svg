<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Dabir app icon, macOS pro-app treatment. Same mark (line of ink, proofreader's caret) on a
       dark graphite squircle with a lit top edge, a paper-white line with a soft edge, and the caret
       in madder with a subtle bevel. Tones of the two brand colours only; no third hue. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3138"/>
      <stop offset="0.55" stop-color="#1D1F24"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E6DD"/>
    </linearGradient>
    <linearGradient id="madder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C64842"/>
      <stop offset="0.5" stop-color="#A8322D"/>
      <stop offset="1" stop-color="#7E221F"/>
    </linearGradient>
    <linearGradient id="madderLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset in="b" dy="4" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="arithmetic" k2="-1" k3="1" result="i"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="i" operator="in"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <!-- macOS icon grid: the artwork sits inside the 824px squircle with the standard margin -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#rim)"/>
    <!-- faint rule lines of a manuscript page, barely there -->
    <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="6">
      <line x1="220" y1="300" x2="804" y2="300"/>
      <line x1="220" y1="620" x2="804" y2="620"/>
      <line x1="220" y1="700" x2="804" y2="700"/>
    </g>
  </g>
  <!-- the line of text -->
  <g filter="url(#shadow)">
    <rect x="236" y="402" width="552" height="92" rx="46" fill="url(#paper)"/>
  </g>
  <rect x="236" y="402" width="552" height="46" rx="46" fill="#FFFFFF" fill-opacity="0.35"/>
  <!-- the caret -->
  <g filter="url(#shadow)">
    <path d="M512 494 L748 770 H636 L512 628 L388 770 H276 Z" fill="url(#madder)"/>
  </g>
  <path d="M512 494 L748 770 H636 L512 628 L388 770 H276 Z" fill="url(#madderLight)"/>
  <path d="M512 494 L748 770 H636 L512 628 L388 770 H276 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
</svg>
