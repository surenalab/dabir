<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Dabir app icon: the dāl.
       Dabir (دبیر) is Persian for scribe, and د is its first letter, here in the nastaʿlīq hand as a
       reed pen writes it: heavy where the reed lies flat on the descent, fine where it turns and lifts.
       Beside it, one rhombic dot in saffron: the nuqta, the calligrapher's unit of measure, which is
       also the one mark a coauthor leaves on a page. Paper and saffron on lajvard, the lapis-and-gold
       of the illuminated manuscript; no other hue.
       Drawn to the macOS icon grid (824 px squircle with the standard margin). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E4E8C"/>
      <stop offset="0.55" stop-color="#22396B"/>
      <stop offset="1" stop-color="#15254A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E1D7"/>
    </linearGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C25A"/>
      <stop offset="0.55" stop-color="#E0A62E"/>
      <stop offset="1" stop-color="#B07E17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="16" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#rim)"/>
  </g>
  <!-- the stroke -->
  <g filter="url(#shadow)" transform="translate(1024 0) scale(-1 1) translate(512 512) scale(1.22) translate(-586 -470)">
    <path fill="url(#paper)" d="M688 236 C728 232 768 262 760 302 C752 336 722 360 696 388 C654 434 616 486 588 540 C568 580 574 616 618 634 C672 656 742 640 806 604 C766 662 684 700 598 686 C512 672 464 606 484 530 C512 428 590 328 668 250 C674 244 680 238 688 236 Z"/>
  </g>
  <!-- the nuqta -->
  <g filter="url(#shadow)">
    <path fill="url(#saffron)" d="M672 676 L734 730 L672 784 L610 730 Z"/>
  </g>
</svg>
